services:
  alejoide-web:
    image: alejoide/alejoide-web:latest
    container_name: alejoide-web
    restart: unless-stopped
    env_file:
      - ./config/alejoide-web/.env
    networks:
      - internal

  projects-api:
    image: alejoide/projects-api:latest
    container_name: projects-api
    restart: unless-stopped
    env_file:
      - ./config/projects-api/.env
    volumes:
      - projects-api-data:/app/src/data/
    networks:
      - nginx-proxy
      - internal

  # Panel interno de administración de proyectos.
  # Se expone solo a través de nginx-proxy-manager (red nginx-proxy) hacia
  # projects-admin-frontend:4321, restringido con una access list.
  projects-admin-frontend:
    image: alejoide/projects-admin-frontend:latest
    container_name: projects-admin-frontend
    restart: unless-stopped
    env_file:
      - ./config/projects-admin-frontend/.env
    depends_on:
      - projects-api
    networks:
      - nginx-proxy
      - internal

  nginx:
    image: nginx:1.29-alpine
    container_name: alejoide-nginx
    env_file:
      - ./config/nginx/.env
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    restart: always
    depends_on:
      - alejoide-web
      - projects-api
    networks:
      - nginx-proxy
      - internal

volumes:
  projects-api-data:
    name: projects-api-data

networks:
  nginx-proxy:
    name: nginx-proxy
    external: true
  internal:
    name: alejoide-internal
    driver: bridge
